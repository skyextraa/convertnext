services:
  - type: web
    name: convertnest
    runtime: python
    plan: free
    buildCommand: >-
      apt-get update &&
      apt-get install -y ffmpeg curl ca-certificates git build-essential &&
      curl -fsSL https://deb.nodesource.com/setup_22.x | bash - &&
      apt-get install -y nodejs &&
      rm -rf /opt/bgutil-ytdlp-pot-provider &&
      git clone --depth 1 --branch 1.3.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil-ytdlp-pot-provider &&
      cd /opt/bgutil-ytdlp-pot-provider/server &&
      npm ci &&
      npx tsc &&
      cd /opt/render/project/src &&
      pip install -r requirements.txt
    startCommand: >-
      export YTDL_POT_PROVIDER_URL=http://127.0.0.1:4416 &&
      node /opt/bgutil-ytdlp-pot-provider/server/build/main.js --port 4416 > /tmp/bgutil-pot.log 2>&1 &
      for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4416/ping >/dev/null && break; sleep 1; done;
      curl -fsS http://127.0.0.1:4416/ping >/dev/null || (cat /tmp/bgutil-pot.log && exit 1);
      exec gunicorn --workers 1 --threads 4 --timeout 900 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: YTDL_POT_PROVIDER_URL
        value: http://127.0.0.1:4416
